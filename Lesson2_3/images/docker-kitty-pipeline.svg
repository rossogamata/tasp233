<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Docker Kitty Lab: від Dockerfile до Docker Hub</title>
  <desc id="desc">Схема з чотирма кроками: написати Dockerfile, зібрати image, запустити контейнер і опублікувати його в Docker Hub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff7fb"/><stop offset="1" stop-color="#ffd2e3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#9b5274" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <text x="60" y="58" font-family="Trebuchet MS, sans-serif" font-size="28" font-weight="700" fill="#432438">Docker Kitty Lab</text>
  <text x="60" y="88" font-family="Trebuchet MS, sans-serif" font-size="16" fill="#7f5c70">Чотири кроки від коду до опублікованого контейнера</text>
  <g stroke="#ef4f89" stroke-width="4" stroke-linecap="round" fill="none"><path d="M280 225h55"/><path d="M560 225h55"/><path d="M840 225h55"/></g>
  <g fill="#ef4f89"><path d="m326 213 18 12-18 12z"/><path d="m606 213 18 12-18 12z"/><path d="m886 213 18 12-18 12z"/></g>
  <g filter="url(#shadow)">
    <rect x="55" y="125" width="225" height="205" rx="20" fill="#fff9f2" stroke="#f2a5c1" stroke-width="2"/>
    <rect x="335" y="125" width="225" height="205" rx="20" fill="#fff9f2" stroke="#f2a5c1" stroke-width="2"/>
    <rect x="615" y="125" width="225" height="205" rx="20" fill="#fff9f2" stroke="#f2a5c1" stroke-width="2"/>
    <rect x="895" y="125" width="250" height="205" rx="20" fill="#fff9f2" stroke="#f2a5c1" stroke-width="2"/>
  </g>
  <g font-family="Trebuchet MS, sans-serif" text-anchor="middle" fill="#432438">
    <text x="167" y="171" font-size="18" font-weight="700">1. Dockerfile</text>
    <text x="447" y="171" font-size="18" font-weight="700">2. docker build</text>
    <text x="727" y="171" font-size="18" font-weight="700">3. docker run</text>
    <text x="1020" y="171" font-size="18" font-weight="700">4. Docker Hub</text>
    <text x="167" y="272" font-size="14" fill="#7f5c70">FROM nginx</text><text x="167" y="296" font-size="14" fill="#7f5c70">COPY site/index.html</text>
    <text x="447" y="272" font-size="14" fill="#7f5c70">створюємо image</text><text x="447" y="296" font-size="14" fill="#7f5c70">lesson2-3-web:1.0</text>
    <text x="727" y="272" font-size="14" fill="#7f5c70">контейнер працює</text><text x="727" y="296" font-size="14" fill="#7f5c70">localhost:8080</text>
    <text x="1020" y="272" font-size="14" fill="#7f5c70">tag + push</text><text x="1020" y="296" font-size="14" fill="#7f5c70">публічний repository</text>
  </g>
  <g transform="translate(140 188)" stroke="#432438" stroke-width="4">
    <path d="M0 20 22 0l18 22" fill="#fff9f2"/><path d="m80 20-22-20-18 22" fill="#fff9f2"/><path d="M8 22c0-25 64-25 64 0v42c0 25-64 25-64 0z" fill="#fff9f2"/>
    <circle cx="27" cy="45" r="4" fill="#432438"/><circle cx="53" cy="45" r="4" fill="#432438"/><circle cx="40" cy="55" r="4" fill="#ffd764"/>
  </g>
  <g transform="translate(1002 188)" stroke="#432438" stroke-width="4"><path d="M0 25c0-18 18-25 35-25s35 7 35 25v40H0z" fill="#ffd764"/><path d="M17 25v40M53 25v40M0 43h70" fill="none"/><path d="M35 0v-18M35-18l-8 8m8-8 8 8" fill="none"/></g>
</svg>
